; Модуль 2.6 · домашка 2.4 на ESP-IDF (без Arduino).
; Окремий проєкт, бо IDF збирає src/ через CMake, а не через build_src_filter.
[env:module-2-6-debounce]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
